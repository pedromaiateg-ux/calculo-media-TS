
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
<script type="module" src="./dist/app.js" defer></script>
</head>
<body>
    <main class="container">
        <section>
            <h1>Calculadora de Média</h1>
            <p>Informe os Dados do Aluno</p>
            
            <form id="formulario">
                <label for="nome">Nome do Aluno</label>
                <input type="text" id="nome" placeholder="Digite o nome do Aluno" required>
                <br>
                
                <label for="nota1">Nota 1</label>
                <input type="number" id="nota1" min="0" max="10" step="0.01" placeholder="Digite a nota" required>
                <br>
                
                <label for="nota2">Nota 2</label>
                <input type="number" id="nota2" min="0" max="10" step="0.01" placeholder="Digite a nota" required>
                <br>
                
                <label for="nota3">Nota 3</label>
                <input type="number" id="nota3" min="0" max="10" step="0.01" placeholder="Digite a nota" required>
                
                <button type="submit">Calcular Média</button>
            </form>
        </section>

        <section id="resultado" aria-live="polite" class="hidden"></section>
    </main>

    <script src="dist/app.js"></script>
</body>
</html>
